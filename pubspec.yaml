name: dyleks_mobile
description: "DyLeks Mobile - game belajar membaca untuk anak disleksia (Tubes PPB)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2   # simpan data di HP
  flutter_tts: ^4.2.0          # suara (text to speech)
  speech_to_text: ^7.0.0       # pengenalan suara untuk Bicara AI

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
